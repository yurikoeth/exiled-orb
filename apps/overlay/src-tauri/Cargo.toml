[package]
name = "exiled-orb-overlay"
version = "0.1.0"
edition = "2021"

[lib]
name = "exiled_orb_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "exiled-orb-overlay"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# OAuth2 PKCE flow
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

# Dev builds: without optimization the full-log character scan and log parsing
# run 10-50x slower. Deps compile at opt 3 ONCE (cached in E:\rust-target);
# our own crate stays at opt 1 so incremental rebuilds remain fast.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
